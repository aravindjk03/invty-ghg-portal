# Render Blueprint for the two server parts of the portal. The website itself
# is static and is published to GitHub Pages (npm run deploy:pages).
#
# Set up: render.com -> New -> Blueprint -> pick this repository and branch.
# Render asks for every value marked `sync: false`; paste the keys there, never
# in this file.
#
# Two things to know before a customer sees this:
#
#  1. A FREE service sleeps after fifteen minutes idle and takes about a minute
#     to wake. While the engine sleeps, every figure on the page reads "the
#     calculation engine is not reachable" - correct behaviour, but a poor first
#     impression. Moving iinvty-insity-edge-ai to `starter` is the single change
#     that most improves how the product feels. It is a paid plan, so it is left
#     as `free` here for you to decide.
#
#  2. The backend keeps accounts, sessions and logs in Postgres when
#     DATABASE_URL is set. Use a free Neon database (neon.tech): Render's free
#     disk is wiped on every deploy or restart, so without DATABASE_URL the
#     accounts would be lost. Paste the Neon connection string when Render asks.
#
# Everything marked `sync: false` is asked for once, in Render's dashboard, and
# never stored in this file. Step-by-step: DEPLOY.md and docs/GO-LIVE-CHECKLIST.md.
services:
  # Login, inventory and reports API (Express; Postgres via DATABASE_URL).
  - type: web
    name: iinvty-backend
    runtime: node
    plan: free
    rootDir: backend
    # Render builds with NODE_ENV=production, which would skip the TypeScript
    # compiler (a dev dependency); --include=dev keeps it for the build.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Neon's POOLED connection string (host contains "-pooler"), from
      # `neon env pull` (.env.local) or the Neon console. node-postgres over TCP,
      # as Neon recommends for a long-running server.
      - key: DATABASE_URL
        sync: false
      # Neon's DIRECT connection string: used only to create the tables on start.
      - key: DATABASE_URL_UNPOOLED
        sync: false
      # The first administrator: created on an empty database, with a one-time
      # password printed once in the Render log.
      - key: ADMIN_EMAIL
        sync: false
      # The admin site's address (Cloudflare Pages), once it exists. Leave empty until then.
      - key: ADMIN_ORIGIN
        sync: false
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://aravindjk03.github.io
      - key: API_SECRET_KEY
        generateValue: true
      # The server refuses to start in production on the development default.
      - key: JWT_SECRET
        generateValue: true
      # YOUR Google OAuth Web client ID (SETUP-GOOGLE.md). Google sign-ins are
      # only accepted when the token was issued to this client.
      - key: GOOGLE_CLIENT_ID
        sync: false
      # How many AI product estimates a free account gets before it is asked to
      # upgrade. Changed here, never in the browser.
      - key: FREE_ESTIMATE_LIMIT
        value: "50"
      # Lets the estimate service spend a customer's credit. Generated once
      # here; the AI service reads the same value through fromService below, so
      # there is no secret to copy by hand and none in this file.
      - key: ESTIMATE_SERVICE_SECRET
        generateValue: true

  # INSITY EDGE AI: the Product Carbon estimator (FastAPI).
  - type: web
    name: iinvty-insity-edge-ai
    runtime: python
    plan: free
    buildCommand: pip install -e ".[service]"
    # Behind Render's proxy, trust X-Forwarded-For so the per-visitor rate limit
    # sees each visitor's address instead of the proxy's.
    startCommand: uvicorn service.app:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      # INSITY EDGE AI answers with the free Gemini models, tried in turn so a
      # busy or rate-limited one hands over to the next. Only GEMINI_API_KEY is
      # needed; ANTHROPIC_API_KEY can be left blank. Visitors only ever see
      # INSITY EDGE AI, and the key stays on this server.
      - key: PCF_AI_PROVIDER
        value: gemini:gemini-3.8-flash,gemini:gemini-3.6-flash,gemini:gemini-3.5-flash-lite,gemini:gemini-3.1-flash-lite
      - key: PCF_CORS_ORIGINS
        value: https://aravindjk03.github.io
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PCF_ADMIN_TOKEN
        generateValue: true
      # The premium chain. Set to Claude (anthropic:claude-opus-5-5) once an
      # ANTHROPIC_API_KEY with credit is added; until then the same free chain.
      - key: PCF_AI_PROVIDER_PREMIUM
        value: gemini:gemini-3.8-flash,gemini:gemini-3.6-flash,gemini:gemini-3.5-flash-lite,gemini:gemini-3.1-flash-lite
      # The same secret the backend generated above. Nothing to paste.
      - key: ESTIMATE_SERVICE_SECRET
        fromService:
          type: web
          name: iinvty-backend
          envVarKey: ESTIMATE_SERVICE_SECRET
      # The account service, including its /api/v1 prefix. This is the address
      # Render gives iinvty-backend; if Render gives it another one, change it
      # here and in the site (IINVTY_BACKEND_URL).
      - key: BACKEND_BASE_URL
        value: https://iinvty-backend.onrender.com/api/v1
