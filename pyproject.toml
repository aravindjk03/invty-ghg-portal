[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghg-core"
version = "1.0.0"
description = "INVTY GHG calculation core - pure, deterministic, dependency-light"
requires-python = ">=3.11"
dependencies = []                       # the engine itself needs nothing

[project.optional-dependencies]
# pint is used ONLY to cross-check units in CI.
# sqlalchemy/alembic are needed by tests/test_database.py, which exercises the
# persistence layer. Without them pytest cannot even collect that module.
# Versions per docs/techstack-and-bugguard.md Part 1.
test = [
    "pytest>=8.0",
    "pint>=0.24",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<1.14",
]

# Explicit, so setuptools never tries to treat data/ or tests/ as packages.
[tool.setuptools]
packages = ["ghg_core"]

[tool.setuptools.package-data]
ghg_core = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
